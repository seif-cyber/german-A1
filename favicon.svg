  <!-- Bold A1 typography -->
  <text x="32" y="45" text-anchor="middle" fill="#ffffff" font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" letter-spacing="-1">A1</text>
